{% extends "base.html" %}
{% block winpath %}LEADERBOARD{% endblock %}
{% block content %}
  <h2>Leaderboard</h2>
  <div class="toolbar">
    <label>Country
      <select id="country">
        <option value="">&mdash; all &mdash;</option>
        {% for c in countries %}<option value="{{ c }}" {{ 'selected' if c == country }}>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <input type="search" id="search" placeholder="Search player..." value="{{ search }}">
  </div>

  <table class="info">
    <thead><tr><th class="rank">#</th><th>Player</th><th class="acc">Accuracy</th><th class="pp">PP</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="muted">Loading&hellip;</td></tr></tbody>
  </table>

  <div class="pager">
    <button class="btn" id="prev">&laquo; Prev</button>
    <span id="pageinfo" class="muted"></span>
    <button class="btn" id="next">Next &raquo;</button>
  </div>

<script>
const SIZE = {{ page_size }};
let page = {{ page if page > 0 else 1 }};
const rows = document.getElementById('rows');
const q = {country: document.getElementById('country'), search: document.getElementById('search')};

function flag(cc){ return cc && cc !== 'XX' ? `<img src="https://flagcdn.com/20x15/${cc.toLowerCase()}.png" width="20" height="15" style="vertical-align:middle"> ` : ''; }

async function load(){
  rows.innerHTML = '<tr><td colspan="4" class="muted">Loading&hellip;</td></tr>';
  const p = new URLSearchParams({page});
  if (q.country.value) p.set('countryCode', q.country.value);
  if (q.search.value) p.set('search', q.search.value);
  const r = await fetch('/api/players?' + p);
  const data = await r.json();
  const start = (page - 1) * SIZE;
  if (!data.players.length){ rows.innerHTML = '<tr><td colspan="4" class="muted">No players.</td></tr>'; }
  else rows.innerHTML = data.players.map((u, i) => `
    <tr>
      <td class="rank">#${start + i + 1}</td>
      <td>${flag(u.countryCode)}<a href="/users/${u.id}">${u.username}</a></td>
      <td class="acc">${u.totalAccuracy === null ? '-' : u.totalAccuracy.toFixed(2)}%</td>
      <td class="pp">${u.totalPp === null ? '-' : u.totalPp.toFixed(0)}</td>
    </tr>`).join('');
  const pages = Math.max(1, Math.ceil((data.total || 0) / SIZE));
  document.getElementById('pageinfo').textContent = `page ${page} / ${pages} (${data.total} players)`;
  document.getElementById('prev').disabled = page <= 1;
  document.getElementById('next').disabled = page >= pages;
  const url = new URLSearchParams();
  if (page > 1) url.set('page', page);
  if (q.country.value) url.set('country', q.country.value);
  if (q.search.value) url.set('search', q.search.value);
  history.replaceState(null, '', '/leaderboard' + (url.toString() ? '?' + url : ''));
}
document.getElementById('prev').onclick = () => { if (page > 1){ page--; load(); } };
document.getElementById('next').onclick = () => { page++; load(); };
q.country.onchange = () => { page = 1; load(); };
let t; q.search.oninput = () => { clearTimeout(t); t = setTimeout(() => { page = 1; load(); }, 400); };
load();
</script>
{% endblock %}
