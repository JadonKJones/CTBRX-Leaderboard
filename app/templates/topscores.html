{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block winpath %}TOPSCORES{% endblock %}
{% block content %}

    {{ m.score_card(s, rank=loop.index) }}

    <p class="muted">No scored plays with pp yet.</p>
  {% endfor %}
{% endblock %}
